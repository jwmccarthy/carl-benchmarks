[project]
name = "carl-benchmarks"
version = "0.1.0"
description = "Matched PPO benchmarks for CARL and RLGym RocketSim"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "carl[gymnasium]",
    "gymnasium>=1.0",
    "jarl",
    "rlgym-rocket-league[sim]==2.0.1",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.0",
    "torch>=2.7",
]

[tool.uv.sources]
carl = { path = "../CARL" }
jarl = { path = "../JARL" }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
